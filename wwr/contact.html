<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - White Water Rafting Co.</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

<header>
    <img src="images/logo_rafting.png" alt="Rafting Logo" class="logo">
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="trips.html">Trips</a></li>
            <li><a href="contact.html">Contact Us</a></li>
        </ul>
    </nav>
</header>

<main>
    <div class="company-header">
        <h1>White Water Rafting Company</h1>
        <p>123 Main River Street</p>
        <p>Kolob, California</p>
        <p>+1 999 999 9999</p>
        <p>info@whitewater.com</p>
    </div>

    <section class="contact-grid">
        <div class="map-container">
            <iframe 
                src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d15053.447348421894!2d-86.8744!3d20.511!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2smx!4v1712280000000!5m2!1sen!2smx" 
                width="100%" 
                height="400" 
                style="border:0;" 
                allowfullscreen="" 
                loading="lazy">
            </iframe>
        </div>

        <div class="form-container">
            <form action="#" method="post">
                <div class="input-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" placeholder="Your Name">
                </div>
                
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Your Email">
                </div>
                
                <p><strong>Message Purpose</strong></p>
                <div class="radio-options">
                    <label><input type="radio" name="purpose" checked> General Inquiry</label>
                    <label><input type="radio" name="purpose"> Reservation Question</label>
                    <label><input type="radio" name="purpose"> Website Suggestion</label>
                </div>

                <div class="input-group">
                    <label for="msg">Message</label>
                    <textarea id="msg" placeholder="Type here..." rows="4"></textarea>
                </div>

                <label class="newsletter">
                    <input type="checkbox"> Please subscribe me to the monthly newsletter
                </label>
                
                <button type="submit">Get in Touch!</button>
            </form>
        </div>
    </section>

    <section class="team-section">
        <h2>We Are Here to Serve You</h2>
        <div class="team-display">
            <figure>
                <img src="images/employe_two.png" alt="Guide">
                <figcaption>Employee Profile</figcaption>
            </figure>
            <figure>
                <img src="images/employe_one.png" alt="Manager">
                <figcaption>Employee Profile</figcaption>
            </figure>
            <figure>
                <img src="images/employer_three.png" alt="Support">
                <figcaption>Employee Profile</figcaption>
            </figure>
        </div>
    </section>
</main>

<footer>
    <p>© 2026 White Water Rafting Co. | Emanuel Vera</p>
    <div class="socialmedia">
        <a href="#"><img src="images/facebook.png" alt="FB"></a>
        <a href="#"><img src="images/linkedin.png" alt="IN"></a>
        <a href="#"><img src="images/instagram.jpg" alt="IG"></a>
    </div>
</footer>

</body>
</html>
